name: NinebotCast
options:
  bundleIdPrefix: com.corpsezhao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  NinebotCast:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Vendor/kcp
    dependencies:
      - target: ScreenCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corpsezhao.ninebotcast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Support/BridgingHeader.h"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/kcp"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Ninebot Cast
        CFBundleShortVersionString: "0.20.0"
        CFBundleVersion: "20"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: 用于连接九号仪表并发送投屏画面（UDP 5012/5013）。
        NSCameraUsageDescription: 用于摄像头画面投屏。
        NSPhotoLibraryUsageDescription: 用于相册图片和视频投屏。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # 屏幕镜像：ReplayKit 录屏广播扩展（Broadcast/）。
  # 扩展自发现仪表，不需要 App Groups；只支持五寸 H.264/RTP。
  ScreenCast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corpsezhao.ninebotcast.screencast
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: NinebotCast
        CFBundleShortVersionString: "0.20.0"
        CFBundleVersion: "20"

schemes:
  NinebotCast:
    build:
      targets:
        NinebotCast: all
    run:
      config: Debug
    archive:
      config: Release
