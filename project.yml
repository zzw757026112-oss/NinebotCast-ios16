name: "Ninebot Pro+"
options:
  bundleIdPrefix: com.corpsezhao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  "Ninebot Pro+":
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - VehicleBLE.swift
      - path: Vendor/kcp
      - path: Shared/HUDOverlay.swift
      - path: Shared/OrientationRelay.swift
      - path: Shared/HUDSettingsRelay.swift
      - path: Shared/HUDDataRelay.swift
      - path: Shared/ANTBMSRelay.swift
      - path: Shared/SpeedRelay.swift
      - path: Shared/RideActivity.swift
      - path: Shared/LicenseManager.swift
    dependencies:
      - target: ScreenCast
      - target: LiveActivityWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corpsezhao.ninebotcast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Support/BridgingHeader.h"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/kcp"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Ninebot Pro+
        CFBundleShortVersionString: "1.2.9"
        CFBundleVersion: "53"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [audio, bluetooth-central, location]
        NSLocalNetworkUsageDescription: 用于连接九号仪表并发送投屏画面（UDP 5012/5013）。
        NSCameraUsageDescription: 用于摄像头画面投屏。
        NSPhotoLibraryUsageDescription: 用于相册图片和视频投屏。
        NSBluetoothAlwaysUsageDescription: 用于直连九号滑板车，读取速度、电量和电压，以及连接 ANT BMS 锂电池读取电池数据，显示在仪表上。
        NSLocationWhenInUseUsageDescription: 用于显示当地天气（按定位取天气，叠加到仪表画面上）。
        NSLocationAlwaysAndWhenInUseUsageDescription: 骑行记录需要在后台持续定位（骑行时退后台也继续记里程和速度）；只在骑行时用，不会一直跑定位。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # 屏幕镜像：ReplayKit 录屏广播扩展（Broadcast/）。
  # 扩展自发现仪表，不需要 App Groups；只支持五寸 H.264/RTP。
  ScreenCast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
        excludes:
          - README.md
      - path: Shared/HUDOverlay.swift
      - path: Shared/OrientationRelay.swift
      - path: Shared/HUDSettingsRelay.swift
      - path: Shared/HUDDataRelay.swift
      - path: Shared/ANTBMSRelay.swift
      - path: Shared/SpeedRelay.swift
      - path: Shared/LicenseManager.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corpsezhao.ninebotcast.screencast
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Ninebot Pro+
        CFBundleShortVersionString: "1.2.9"
        CFBundleVersion: "53"
        # NSExtension MUST live here: xcodegen writes only the
        # properties into the plist, so the NSExtension dict that
        # used to live only in Broadcast/Info.plist was lost and
        # the 0.20.0 build's extension had no NSExtension key —
        # iOS would not recognise it as a broadcast extension.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: ScreenCast.SampleHandler

  # 动态岛扩展（Live Activity，锁屏 + 灵动岛）：1.2.9 新增。
  # 部署目标 iOS 16.2（ActivityContent 形式的 request/update/end 要 16.2）；
  # 主 App 还是 16.0，16.1 及以下机器上扩展不加载、App 里所有 ActivityKit 调用都被
  # if #available(iOS 16.2, *) 挡住，不会闪退。
  LiveActivityWidget:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: "16.2"
    sources:
      - path: LiveActivity
      - path: Shared/RideActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corpsezhao.ninebotcast.liveactivity
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Ninebot Pro+
        CFBundleShortVersionString: "1.2.9"
        CFBundleVersion: "53"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
          NSExtensionPrincipalClass: LiveActivityWidget.LiveActivityBundle

schemes:
  "Ninebot Pro+":
    build:
      targets:
        "Ninebot Pro+": all
    run:
      config: Debug
    archive:
      config: Release
